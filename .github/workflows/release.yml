name: Draft release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Version tags serialize their runs. Manual main runs only preview artifacts.
concurrency:
  group: draft-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release candidate
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: 1.99.1-x86_64-pc-windows-msvc
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      sha: ${{ steps.gate.outputs.sha }}
      ci_url: ${{ steps.gate.outputs.ci_url }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
    steps:
      - name: Check out full source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select pinned Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --no-self-update

      - name: Verify version, main ancestry, and successful main CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/check-release.ps1

      # The gate requires this exact commit's complete main CI checks. Rebuild
      # the release here using the same pinned toolchain and locked dependencies.
      - name: Build portable executable
        run: cargo build --release --locked

      - name: Package release candidate
        env:
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
          RELEASE_SHA: ${{ steps.gate.outputs.sha }}
        run: ./tools/package-release.ps1 -Version $env:RELEASE_VERSION -Commit $env:RELEASE_SHA

      - name: Upload candidate for preview or draft creation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RedEye-release-candidate
          path: |
            dist/release-assets/RedEye.exe
            dist/release-assets/RedEye-windows-x64.zip
            dist/release-assets/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Create draft release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      # This job never checks out source or executes repository scripts/binaries.
      - name: Download this run's candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: RedEye-release-candidate
          path: release-assets

      - name: Verify downloads and create an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          RELEASE_CI_URL: ${{ needs.build.outputs.ci_url }}
          RELEASE_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $version = $env:RELEASE_VERSION
          $tag = $env:RELEASE_TAG
          $sha = $env:RELEASE_SHA
          $repo = $env:GITHUB_REPOSITORY
          $semver = '\A(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?\z'
          if ($version -cnotmatch $semver -or $tag -cne "v$version" -or $sha -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Invalid release identity from the build gate.' }
          if ($repo -cnotmatch '\A[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\z') { throw 'Invalid repository identity.' }
          if ($env:RELEASE_PRERELEASE -cne $(if ($version.Split('+')[0].Contains('-')) { 'true' } else { 'false' })) { throw 'Invalid prerelease classification.' }
          if ($env:RELEASE_CI_URL -cnotmatch ('\Ahttps://github\.com/' + [regex]::Escape($repo) + '/actions/runs/[0-9]+\z')) { throw 'Invalid main CI evidence URL.' }

          $expected = @('RedEye.exe', 'RedEye-windows-x64.zip', 'SHA256SUMS.txt')
          $files = @(Get-ChildItem -LiteralPath release-assets -Force)
          if ($files.Count -ne 3 -or @($files | Where-Object { $_.PSIsContainer -or $_.Name -cnotin $expected }).Count -ne 0) { throw 'Unexpected downloaded release files.' }
          $lines = @(Get-Content -LiteralPath release-assets/SHA256SUMS.txt)
          if ($lines.Count -ne 2) { throw 'Expected exactly two external checksums.' }
          $seen = @{}
          foreach ($line in $lines) {
            if ($line -cnotmatch '\A([0-9a-f]{64})  (RedEye\.exe|RedEye-windows-x64\.zip)\z') { throw 'Invalid checksum entry.' }
            $hash = $Matches[1]
            $name = $Matches[2]
            if ($seen.ContainsKey($name)) { throw 'Duplicate checksum entry.' }
            $seen[$name] = $hash
            if ((Get-FileHash -LiteralPath (Join-Path release-assets $name) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hash) { throw "Downloaded checksum mismatch: $name" }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD 'release-assets/RedEye-windows-x64.zip'))
          try {
            $zipNames = @('RedEye.exe', 'README.txt', 'SHA256SUMS.txt')
            if ($zip.Entries.Count -ne 3 -or @($zip.Entries | Where-Object { $_.FullName -cnotin $zipNames }).Count -ne 0 -or @($zip.Entries.FullName | Select-Object -Unique).Count -ne 3) { throw 'Unexpected ZIP entries.' }
            $payload = @{}
            foreach ($entry in $zip.Entries) {
              $stream = $entry.Open()
              $memory = [IO.MemoryStream]::new()
              try { $stream.CopyTo($memory); $payload[$entry.FullName] = $memory.ToArray() } finally { $memory.Dispose(); $stream.Dispose() }
            }
            $inside = @([Text.Encoding]::ASCII.GetString($payload['SHA256SUMS.txt']) -split '\r?\n' | Where-Object { $_ })
            if ($inside.Count -ne 2) { throw 'Expected exactly two internal checksums.' }
            $insideSeen = @{}
            $hasher = [Security.Cryptography.SHA256]::Create()
            try {
              foreach ($line in $inside) {
                if ($line -cnotmatch '\A([0-9a-f]{64})  (RedEye\.exe|README\.txt)\z') { throw 'Invalid internal checksum entry.' }
                $hash = $Matches[1]; $name = $Matches[2]
                if ($insideSeen.ContainsKey($name)) { throw 'Duplicate internal checksum entry.' }
                $insideSeen[$name] = $hash
                if ([BitConverter]::ToString($hasher.ComputeHash($payload[$name])).Replace('-', '').ToLowerInvariant() -cne $hash) { throw "ZIP checksum mismatch: $name" }
              }
            } finally { $hasher.Dispose() }
            if ($insideSeen['RedEye.exe'] -cne $seen['RedEye.exe']) { throw 'ZIP and standalone executables differ.' }
            $readme = [Text.Encoding]::UTF8.GetString($payload['README.txt'])
            if (!$readme.Contains("RedEye $version -") -or !$readme.Contains("Source commit: $sha")) { throw 'ZIP README identity differs from the validated build.' }
          } finally { $zip.Dispose() }

          $escapedTag = [Uri]::EscapeDataString($tag)
          $remoteSha = & gh api --method GET "repos/$repo/commits/$escapedTag" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $remoteSha -cne $sha) { throw 'The existing remote tag no longer identifies the validated commit.' }
          $existingTags = @(& gh api --method GET --paginate "repos/$repo/releases?per_page=100" --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check existing releases; refusing to create a draft.' }
          if ($existingTags -ccontains $tag) { throw 'A release or draft already exists for this tag. Inspect it manually; remove an incomplete draft only after review, then retry. Existing releases/assets are never overwritten.' }
          $notes = @(
            "RedEye $version portable Windows x64 release.",
            "Source commit: $sha",
            "Successful main CI: $env:RELEASE_CI_URL",
            '',
            'Assets: RedEye.exe, RedEye-windows-x64.zip, SHA256SUMS.txt.',
            'The ZIP includes a versioned README and internal checksums.',
            '',
            'Windows 11 core behavior was checked during development. Windows 10, real sign-in, real Explorer restart, cross-session isolation, DPI changes, and lock/explicit-sleep behavior remain unverified. Automated builds do not replace these native checks.',
            'See docs/VALIDATION.md in the source repository for evidence and exact manual steps.',
            '',
            'Created as a draft for owner review; publication is manual.'
          )
          $notes | Set-Content -LiteralPath release-notes.txt -Encoding utf8
          $arguments = @('release', 'create', $tag, '--repo', $repo, '--draft', '--verify-tag', '--target', $sha, '--title', "RedEye $version", '--notes-file', 'release-notes.txt')
          if ($env:RELEASE_PRERELEASE -ceq 'true') { $arguments += '--prerelease' }
          $arguments += @('release-assets/RedEye.exe', 'release-assets/RedEye-windows-x64.zip', 'release-assets/SHA256SUMS.txt')
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation/upload failed. Inspect any partial draft and its assets manually before retrying; this workflow will not overwrite it.' }
