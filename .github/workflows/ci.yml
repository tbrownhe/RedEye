name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs can stop. Every push/manual run gets a unique group so
# running or pending main-branch checks are never canceled by a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows CI
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: 1.99.1-x86_64-pc-windows-msvc
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select pinned Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy --no-self-update

      - name: Show compiler version
        run: rustc --version --verbose

      - name: Check formatting
        run: cargo fmt --check

      - name: Check compilation
        run: cargo check --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build portable executable
        run: cargo build --release --locked

      - name: Write executable checksum
        run: |
          $hash = (Get-FileHash -LiteralPath 'target/release/redeye.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  redeye.exe" | Set-Content -LiteralPath 'target/release/SHA256SUMS.txt' -Encoding ascii

      - name: Upload executable and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RedEye-windows-x64
          path: |
            target/release/redeye.exe
            target/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
